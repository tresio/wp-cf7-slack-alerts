name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7.2 is the floor the plugin header claims. Running the suite there,
        # rather than only linting, is what proves an unattended update cannot
        # push code a site's PHP cannot execute.
        php: ['7.2', '7.4', '8.0', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Lint every PHP file
        run: |
          find . -path ./vendor -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      # No lock file is committed, so each PHP version resolves the PHPUnit it
      # can actually run (8.5 on 7.2, 9.6 above).
      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Unit tests
        run: vendor/bin/phpunit --configuration phpunit.xml.dist

  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Header and constant agree
        run: bash bin/version.sh check

      - name: Release scripts are syntactically valid
        run: |
          for script in bin/*.sh tests/**/*.sh; do
            [ -f "$script" ] && bash -n "$script"
          done
          shellcheck -S warning bin/*.sh tests/docker/lib.sh tests/integration/run.sh tests/e2e/run.sh

  package:
    name: Build zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash bin/build.sh

      - name: Confirm the archive has a single correctly named root folder
        run: |
          ROOTS=$(unzip -Z1 dist/cf7-slack-error-alerts.zip | cut -d/ -f1 | sort -u)
          if [ "$ROOTS" != "cf7-slack-error-alerts" ]; then
            echo "::error::Unexpected archive layout: $ROOTS"
            exit 1
          fi

      - name: Confirm no development files were shipped
        run: |
          if unzip -Z1 dist/cf7-slack-error-alerts.zip | grep -qE 'tests/|vendor/|\.github/|bin/|composer\.'; then
            echo "::error::Development files leaked into the release zip"
            unzip -Z1 dist/cf7-slack-error-alerts.zip
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cf7-slack-error-alerts
          path: dist/cf7-slack-error-alerts.zip
          if-no-files-found: error

  integration:
    name: WordPress integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Run against real WordPress
        run: bash tests/integration/run.sh

  e2e:
    name: Unattended update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the previous published release, then runs WordPress's own
      # updater against the real GitHub release and checks the site survived.
      - name: Upgrade a real site to the current release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tests/e2e/run.sh

  # Single required check for branch protection. Requiring the individual jobs
  # instead means a renamed job silently stops being required, and a job added
  # later is not gated until someone remembers to update the branch rule.
  gate:
    name: CI
    if: always()
    needs: [ unit, version, package, integration, e2e ]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        run: |
          RESULTS='${{ join(needs.*.result, ",") }}'
          echo "Job results: $RESULTS"
          case ",$RESULTS," in
            *,failure,*|*,cancelled,*)
              echo "::error::A required job did not succeed"
              exit 1
              ;;
          esac
          echo "All required jobs succeeded."
